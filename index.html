<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./favicon.png">
    <title>Ranking Cobrança - V4 Company</title>
    <meta http-equiv="refresh" content="600">
    <style>
        :root {
            --bg: #030303;
            --card-bg: #0a0a0a;
            --v4-red: #ed1c24;
            --v4-red-glow: rgba(237, 28, 36, 0.4);
            --border: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #777777;
            --text-subtle: #555555;
            --green: #52cc5a; 
            --green-glow: rgba(82, 204, 90, 0.4);
            --gold-v4: #ffc02a;
            --gold-v4-glow: rgba(255, 192, 42, 0.25);
            --silver: #e2e8f0;
            --bronze: #cd7f32;
            --cyan-accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            border-radius: 0px !important;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tv-board {
            width: 1280px;
            height: 720px;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            padding: 20px 25px;
            transform-origin: center center;
        }

        /* Header */
        .header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--v4-red);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 2em;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
            color: var(--v4-red);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #mes-atual {
            font-size: 1.1em;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .logo-v4 { 
            height: 42px; 
            object-fit: contain; 
        }

        /* Layout Principal 20% / 80% */
        .main-content {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            min-height: 0;
        }

        /* LATERAL ESQUERDA (Destaques) */
        .left-panel {
            width: 20%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .highlight-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-top: 4px solid var(--gold-v4);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .highlight-header {
            background: #111;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border);
        }

        .highlight-header h2 {
            margin: 0;
            color: var(--gold-v4);
            font-size: 0.95em;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
        }

        .highlight-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: linear-gradient(180deg, rgba(255,192,42,0.05) 0%, #050505 100%);
            text-align: center;
            overflow: hidden;
        }

        .highlight-avatar {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border: 2px solid var(--gold-v4);
            margin-bottom: 8px;
            box-shadow: 0 5px 15px var(--gold-v4-glow);
        }

        .highlight-name {
            font-size: 1.05em;
            font-weight: 900;
            margin-bottom: 6px;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .highlight-label {
            color: var(--text-muted);
            font-size: 0.72em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
            text-align: center;
        }

        .highlight-val {
            font-size: 1.35em;
            font-weight: 900;
            color: var(--green);
            text-align: center;
        }

        /* LATERAL DIREITA */
        .right-panel {
            width: 80%;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-width: 0;
        }

        /* KPIs: 2 Cards Consolidados (HOJE e MÊS) */
        .kpi-grid {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 14px;
        }

        .kpi-card {
            background: var(--card-bg);
            padding: 12px 18px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--v4-red);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .kpi-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .kpi-badge-title {
            font-size: 0.72em;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .kpi-badge-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--v4-red);
        }

        .kpi-pct-badge {
            font-size: 1.15em;
            font-weight: 900;
            color: var(--text-main);
        }

        .kpi-pct-badge.achieved {
            color: var(--green);
            text-shadow: 0 0 10px var(--green-glow);
        }

        .kpi-metrics-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 8px;
        }

        .kpi-metric-block {
            display: flex;
            flex-direction: column;
        }

        .kpi-metric-block.right {
            align-items: flex-end;
            text-align: right;
        }

        .kpi-metric-label {
            font-size: 0.65em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
            margin-bottom: 1px;
        }

        .kpi-metric-val {
            font-size: 1.35em;
            font-weight: 900;
            line-height: 1.1;
        }

        .kpi-bar-bg {
            background: #181818;
            height: 6px;
            width: 100%;
            overflow: hidden;
            border: 1px solid #242424;
        }

        .kpi-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.8s ease-in-out;
        }

        .kpi-bar-fill.hoje {
            background: linear-gradient(90deg, #ffc02a 0%, var(--green) 100%);
            box-shadow: 0 0 10px rgba(82, 204, 90, 0.3);
        }

        .kpi-bar-fill.mes {
            background: linear-gradient(90deg, var(--v4-red) 0%, var(--green) 100%);
            box-shadow: 0 0 10px var(--v4-red-glow);
        }

        /* Pódio (Top 3) */
        .podium-wrapper {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 16px;
            margin-bottom: 12px;
        }

        .podium-step {
            background: linear-gradient(180deg, #111111 0%, #050505 100%);
            border: 1px solid var(--border);
            width: 32%;
            max-width: 330px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 20px 14px 12px;
            position: relative;
            text-align: center;
            gap: 4px;
            transition: transform 0.3s ease;
        }

        .step-1 { 
            order: 2; 
            height: 258px; 
            border-top: 4px solid var(--v4-red); 
            box-shadow: 0 -10px 30px var(--v4-red-glow);
            z-index: 2;
            padding-top: 22px;
        }
        
        .step-2 { 
            order: 1; 
            height: 236px; 
            border-top: 4px solid var(--silver); 
            padding-top: 16px;
        }

        .step-3 { 
            order: 3; 
            height: 222px; 
            border-top: 4px solid var(--bronze); 
            padding-top: 14px;
        }

        .podium-step:hover { transform: translateY(-3px); }

        /* Termômetro Vertical de Meta Diária (Pódio) */
        .podium-gauge-wrapper {
            position: absolute;
            right: 8px;
            top: 26px;
            bottom: 14px;
            width: 6px;
            background: #141414;
            border: 1px solid #252525;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
        }

        .podium-gauge-fill {
            width: 100%;
            height: 0%;
            background: #f59e0b;
            transition: height 0.8s ease-in-out;
        }

        .podium-gauge-fill.achieved {
            background: var(--green);
            box-shadow: 0 0 10px var(--green-glow);
        }

        .podium-top-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .podium-avatar {
            width: 54px;
            height: 54px;
            object-fit: cover;
            border: 2px solid #333;
            margin-bottom: 4px;
            flex-shrink: 0;
            display: block;
        }

        .step-1 .podium-avatar { width: 66px; height: 66px; border-color: var(--v4-red); }
        .step-2 .podium-avatar { border-color: var(--silver); }
        .step-3 .podium-avatar { border-color: var(--bronze); }

        /* Envoltório da foto para posicionar o selo */
        .podium-avatar-wrap {
            position: relative;
            display: inline-block;
        }

        .avatar-wrap-list {
            position: relative;
            display: inline-block;
            flex-shrink: 0;
        }

        /* Selo Redondo de Cera Vermelha "ON TRACK" */
        .wax-seal,
        .wax-seal-list,
        .wax-seal *,
        .wax-seal-list * {
            border-radius: 50% !important;
        }

        .wax-seal {
            position: absolute;
            right: -13px;
            bottom: -5px;
            width: 32px;
            height: 32px;
            background: radial-gradient(circle at 35% 30%, #ff3b44 0%, #b80c14 55%, #66050a 100%);
            border: 1.5px solid #ff4d55;
            box-shadow: 
                0 3px 8px rgba(0,0,0,0.85),
                inset 0 1.5px 2px rgba(255,255,255,0.45),
                inset 0 -2px 3px rgba(0,0,0,0.7),
                0 0 12px rgba(237, 28, 36, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transform: rotate(-10deg);
            transition: transform 0.2s ease;
            user-select: none;
        }

        .wax-seal:hover {
            transform: rotate(0deg) scale(1.1);
        }

        .wax-seal-inner {
            width: 25px;
            height: 25px;
            border: 1px dashed rgba(255, 215, 215, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 0.85;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }

        .wax-seal-text-on {
            font-size: 6.5px;
            font-weight: 900;
            color: #fff0f1;
            letter-spacing: 0.8px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95);
        }

        .wax-seal-text-track {
            font-size: 5.5px;
            font-weight: 900;
            color: #ffd4d7;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95);
        }

        /* Versão para a lista de classificação */
        .wax-seal-list {
            position: absolute;
            right: -9px;
            bottom: -3px;
            width: 27px;
            height: 27px;
            background: radial-gradient(circle at 35% 30%, #ff3b44 0%, #b80c14 55%, #66050a 100%);
            border: 1.5px solid #ff4d55;
            box-shadow: 
                0 2px 6px rgba(0,0,0,0.85),
                inset 0 1px 2px rgba(255,255,255,0.45),
                inset 0 -1.5px 2px rgba(0,0,0,0.7),
                0 0 10px rgba(237, 28, 36, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transform: rotate(-10deg);
            user-select: none;
        }

        .wax-seal-list .wax-seal-inner {
            width: 21px;
            height: 21px;
            border: 1px dashed rgba(255, 215, 215, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 0.85;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }

        .wax-seal-list .wax-seal-text-on {
            font-size: 5.8px;
            font-weight: 900;
            color: #fff0f1;
            letter-spacing: 0.7px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95);
        }

        .wax-seal-list .wax-seal-text-track {
            font-size: 4.8px;
            font-weight: 900;
            color: #ffd4d7;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95);
        }

        .podium-badge {
            position: absolute;
            top: -16px;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15em;
            font-weight: 900;
            background: #111;
            border: 2px solid;
            color: #fff;
        }
        .step-1 .podium-badge { border-color: var(--v4-red); background: var(--v4-red); top: -20px; width: 40px; height: 40px; font-size: 1.4em; }
        .step-2 .podium-badge { border-color: var(--silver); color: var(--silver); }
        .step-3 .podium-badge { border-color: var(--bronze); color: var(--bronze); }

        .hunter-name {
            font-weight: 800;
            font-size: 0.95em;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 2px 0;
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
            display: block;
        }

        .step-1 .hunter-name { font-size: 1.12em; color: var(--v4-red); }

        .podium-val-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 2px;
        }

        .podium-val-title {
            font-size: 0.65em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .podium-val {
            font-size: 1.25em;
            font-weight: 900;
            color: var(--green);
            text-align: center;
            line-height: 1.1;
            margin-bottom: 6px;
        }

        .step-1 .podium-val {
            font-size: 1.35em;
        }

        /* Split HOJE e MÊS no Pódio */
        .podium-split-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            gap: 6px;
            padding-top: 6px;
            border-top: 1px solid #1a1a1a;
        }

        .podium-split-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0d0d0d;
            border: 1px solid #1f1f1f;
            padding: 5px 4px 6px;
            position: relative;
        }

        .podium-split-col.achieved {
            border-color: rgba(82, 204, 90, 0.4);
        }

        .split-tag {
            font-size: 0.62em;
            font-weight: 900;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .podium-split-col.achieved .split-tag {
            color: var(--green);
        }

        .split-meta {
            font-size: 0.70em;
            font-weight: 700;
            color: #d1d5db;
            white-space: nowrap;
            margin-bottom: 4px;
        }

        /* Box de Porcentagem com preenchimento interno em degradê + listras */
        .split-pct {
            position: relative;
            width: 88%;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #141414;
            border: 1px solid #292929;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
        }

        .split-pct.achieved {
            border-color: rgba(82, 204, 90, 0.7);
            box-shadow: 0 0 8px rgba(82, 204, 90, 0.3), inset 0 1px 3px rgba(0,0,0,0.6);
        }

        /* Camada de preenchimento contínua (estilo barras de cima) */
        .pct-bar-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            pointer-events: none;
            z-index: 1;
            transition: width 0.8s ease-in-out;
        }

        .pct-bar-fill.fill-hoje {
            background: linear-gradient(90deg, #ffc02a 0%, var(--green) 100%);
            box-shadow: 0 0 8px rgba(82, 204, 90, 0.3);
        }

        .pct-bar-fill.fill-mes {
            background: linear-gradient(90deg, var(--v4-red) 0%, var(--green) 100%);
            box-shadow: 0 0 8px var(--v4-red-glow);
        }

        .pct-bar-fill.achieved-fill {
            background: linear-gradient(90deg, #22c55e 0%, var(--green) 100%) !important;
            box-shadow: 0 0 10px var(--green-glow);
        }

        /* Texto da % limpo e sem borda preta pesada */
        .pct-text-val {
            position: relative;
            z-index: 2;
            font-size: 0.82em;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.2px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        /* Lista do 4º em diante */
        .ranking-list {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 8px; 
            overflow-y: auto;
            padding-right: 8px;
        }

        .ranking-list::-webkit-scrollbar { width: 5px; }
        .ranking-list::-webkit-scrollbar-track { background: transparent; }
        .ranking-list::-webkit-scrollbar-thumb { background: var(--v4-red); }

        .ranking-card {
            flex: 0 0 auto; 
            height: 64px;
            background: var(--card-bg);
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid var(--border);
            border-left: 4px solid #333;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .ranking-card:hover {
            border-color: #444;
            transform: translateX(3px);
        }

        .badge-rank-list {
            font-size: 1.05em;
            font-weight: 900;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #151515;
            color: var(--text-muted);
            border: 1px solid #333;
            flex-shrink: 0;
        }

        .avatar-list {
            width: 44px;
            height: 44px;
            object-fit: cover;
            border: 1px solid #333;
            flex-shrink: 0;
        }

        /* Identificação do Hunter + Realizado */
        .hunter-main-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 190px;
            flex-shrink: 0;
        }

        .hunter-main-info .hunter-name {
            font-size: 0.95em;
            text-align: left;
            margin: 0 0 2px 0;
        }

        .hunter-main-info .val-recebido {
            font-size: 1.10em;
            font-weight: 900;
            color: var(--green);
            letter-spacing: -0.3px;
        }

        /* Bloco Split na Lista: HOJE e MÊS */
        .list-split-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .list-split-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #0d0d0d;
            border: 1px solid #1f1f1f;
            padding: 6px 12px;
            min-width: 195px;
            justify-content: space-between;
            position: relative;
        }

        .list-split-box.achieved {
            border-color: rgba(82, 204, 90, 0.4);
        }

        .list-split-meta-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .list-split-tag {
            font-size: 0.60em;
            font-weight: 900;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .list-split-box.achieved .list-split-tag {
            color: var(--green);
        }

        .list-split-meta {
            font-size: 0.85em;
            font-weight: 800;
            color: #e2e8f0;
            white-space: nowrap;
        }

        .list-split-pct {
            position: relative;
            min-width: 66px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #141414;
            border: 1px solid #292929;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
        }

        .list-split-pct.achieved {
            border-color: rgba(82, 204, 90, 0.7);
            box-shadow: 0 0 8px rgba(82, 204, 90, 0.3), inset 0 1px 3px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <div id="tv-board">
        <div class="header">
            <h1>RANKING COBRANÇA</h1>
            <div class="header-right">
                <span id="mes-atual"></span>
                <img src="./logo-v4.jpg" class="logo-v4" alt="V4 Company" onerror="this.style.display='none'">
            </div>
        </div>

        <div class="main-content">
            
            <!-- LATERAL ESQUERDA (Destaques) -->
            <div class="left-panel">
                <div class="highlight-card">
                    <div class="highlight-header">
                        <h2>DESTAQUE DE ONTEM</h2>
                    </div>
                    <div class="highlight-body">
                        <img id="yesterday-avatar" class="highlight-avatar" src="https://via.placeholder.com/150" alt="Destaque Ontem">
                        <div id="yesterday-name" class="highlight-name">-</div>
                        <div class="highlight-label">Total Recebido</div>
                        <div id="yesterday-val" class="highlight-val">R$ 0,00</div>
                    </div>
                </div>

                <div class="highlight-card">
                    <div class="highlight-header">
                        <h2>DESTAQUE DA SEMANA</h2>
                    </div>
                    <div class="highlight-body">
                        <img id="week-avatar" class="highlight-avatar" src="https://via.placeholder.com/150" alt="Destaque Semana">
                        <div id="week-name" class="highlight-name">-</div>
                        <div class="highlight-label">Total Recebido</div>
                        <div id="week-val" class="highlight-val">R$ 0,00</div>
                    </div>
                </div>
            </div>

            <!-- LATERAL DIREITA -->
            <div class="right-panel">
                <!-- 2 Cards Consolidados: HOJE e MÊS -->
                <div class="kpi-grid">
                    <!-- CARD HOJE -->
                    <div class="kpi-card" style="border-left-color: var(--cyan-accent, #38bdf8);">
                        <div class="kpi-card-header">
                            <span class="kpi-badge-title" style="color: #cbd5e1;">Ritmo de Hoje</span>
                            <span class="kpi-pct-badge" id="kpi-pct-hoje">0.0%</span>
                        </div>
                        <div class="kpi-metrics-row">
                            <div class="kpi-metric-block">
                                <span class="kpi-metric-label">Realizado</span>
                                <strong class="kpi-metric-val" id="kpi-hoje-recebido" style="color: var(--green);">R$ 0,00</strong>
                            </div>
                            <div class="kpi-metric-block right">
                                <span class="kpi-metric-label">Meta Hoje</span>
                                <strong class="kpi-metric-val" id="kpi-hoje-meta" style="color: var(--text-main);">R$ 0,00</strong>
                            </div>
                        </div>
                        <div class="kpi-bar-bg">
                            <div class="kpi-bar-fill hoje" id="kpi-hoje-bar"></div>
                        </div>
                    </div>

                    <!-- CARD MÊS -->
                    <div class="kpi-card" style="border-left-color: var(--v4-red);">
                        <div class="kpi-card-header">
                            <span class="kpi-badge-title">Meta Geral Mês</span>
                            <span class="kpi-pct-badge" id="kpi-realizado">0.00%</span>
                        </div>
                        <div class="kpi-metrics-row">
                            <div class="kpi-metric-block">
                                <span class="kpi-metric-label">Realizado Mês</span>
                                <strong class="kpi-metric-val" id="kpi-recebido" style="color: var(--green);">R$ 0,00</strong>
                            </div>
                            <div class="kpi-metric-block right">
                                <span class="kpi-metric-label">Meta Mês</span>
                                <strong class="kpi-metric-val" id="kpi-provisionado" style="color: var(--text-main);">R$ 0,00</strong>
                            </div>
                        </div>
                        <div class="kpi-bar-bg">
                            <div class="kpi-bar-fill mes" id="kpi-overall-fill"></div>
                        </div>
                    </div>
                </div>

                <!-- Pódio Top 3 -->
                <div class="podium-wrapper" id="podium-container"></div>
                
                <!-- Lista de 4º em diante -->
                <div class="ranking-list" id="others-container"></div>
            </div>

        </div>
    </div>

    <script>
        function autoScaleDashboard() {
            const board = document.getElementById('tv-board');
            const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
            board.style.transform = `scale(${scale})`;
        }
        
        window.addEventListener('resize', autoScaleDashboard);
        autoScaleDashboard();

        const DATA_URL_RANKING = 'dados.json';
        const DATA_URL_ONTEM = 'dados2.json';

        // Dados padrão (fallback) caso os arquivos json não existam ou estejam em ambiente blob/sandbox
        const DEFAULT_RANKING = [
            {"rank":"1","foto":"https://lh3.googleusercontent.com/d/1llI2R5YQCzsm-1BBgujAiSEKAosLtIas","hunter":"Eric de Paula","recebido":"168.281,7","provisionado":"1.041.945,36","realizado":"16,15%","meta_hoje":"134.444,56","realizado_hoje":"125,17%"},
            {"rank":"2","foto":"https://lh3.googleusercontent.com/d/1I9zHbh7UQjw0G8E62BgBM-T1SJ2_phxh","hunter":"Deborah Reynaldo","recebido":"149.268,84","provisionado":"1.159.941,88","realizado":"12,87%","meta_hoje":"149.669,92","realizado_hoje":"99,73%"},
            {"rank":"3","foto":"https://lh3.googleusercontent.com/d/1PRm-1_2A2mcj4OLwwEW2lBFYT166eAzc","hunter":"Bruno Ferreira","recebido":"107.130,99","provisionado":"947.705,39","realizado":"11,3%","meta_hoje":"122.284,57","realizado_hoje":"87,61%"},
            {"rank":"4","foto":"https://lh3.googleusercontent.com/d/1moW9yOCdmy9UHw-rsSgdCW_606gKzU0G","hunter":"Izabela Mattano","recebido":"103.145,01","provisionado":"936.472,67","realizado":"11,01%","meta_hoje":"120.835,18","realizado_hoje":"85,36%"},
            {"rank":"5","foto":"https://lh3.googleusercontent.com/d/1lbvSP_l1b1DxtEhbz0ix8g83DKh2qEq0","hunter":"Gerson Xavier","recebido":"90.468,93","provisionado":"913.934,71","realizado":"9,9%","meta_hoje":"117.927,06","realizado_hoje":"76,72%"}
        ];

        const DEFAULT_ONTEM = [
            {
                "top_hunter_ontem": "Eric de Paula",
                "recebido_ontem_val": "73.470,32",
                "top_hunter_semana": "Eric de Paula",
                "recebido_semana_val": "74.634,32"
            }
        ];

        const dataAjustada = new Date();
        dataAjustada.setDate(dataAjustada.getDate() - 3);

        const mesExtenso = dataAjustada.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }).toUpperCase();
        document.getElementById('mes-atual').innerText = mesExtenso;

        function parseNumber(val) {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            return parseFloat(String(val).replace(/\./g, '').replace(',', '.').replace('%', '').trim()) || 0;
        }

        function formatBRL(val) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
        }

        // Formatação limpa e compacta sem centavos para economizar espaço
        function formatBRLCompact(val) {
            return new Intl.NumberFormat('pt-BR', { 
                style: 'currency', 
                currency: 'BRL',
                maximumFractionDigits: 0 
            }).format(val);
        }

        async function fetchSafeJSON(filename, fallbackData) {
            try {
                // Previne o erro "Failed to parse URL" em ambientes iframe/blob que não suportam caminhos relativos
                if (window.location.protocol === 'blob:' || window.location.protocol === 'about:') {
                    return fallbackData;
                }
                const res = await fetch(filename, { cache: 'no-cache' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (err) {
                console.warn(`Aviso ao ler ${filename} (usando dados de fallback):`, err.message);
                return fallbackData;
            }
        }

        async function render() {
            try {
                const [dataRanking, dataOntem] = await Promise.all([
                    fetchSafeJSON(DATA_URL_RANKING, DEFAULT_RANKING),
                    fetchSafeJSON(DATA_URL_ONTEM, DEFAULT_ONTEM)
                ]);

                if (dataOntem && dataOntem.length > 0) {
                    const tops = dataOntem[0];
                    
                    const nomeOntem = tops.top_hunter_ontem || 'Sem Pagamentos';
                    const valorOntem = parseNumber(tops.recebido_ontem_val);
                    const hunterOntemObj = dataRanking.find(d => d.hunter === nomeOntem);
                    
                    document.getElementById('yesterday-name').innerText = nomeOntem;
                    document.getElementById('yesterday-val').innerText = formatBRL(valorOntem);
                    document.getElementById('yesterday-avatar').src = hunterOntemObj ? hunterOntemObj.foto : 'https://via.placeholder.com/150';

                    const nomeSemana = tops.top_hunter_semana || 'Sem Pagamentos';
                    const valorSemana = parseNumber(tops.recebido_semana_val);
                    const hunterSemanaObj = dataRanking.find(d => d.hunter === nomeSemana);
                    
                    document.getElementById('week-name').innerText = nomeSemana;
                    document.getElementById('week-val').innerText = formatBRL(valorSemana);
                    document.getElementById('week-avatar').src = hunterSemanaObj ? hunterSemanaObj.foto : 'https://via.placeholder.com/150';
                }

                const podiumContainer = document.getElementById('podium-container');
                const othersContainer = document.getElementById('others-container');
                podiumContainer.innerHTML = '';
                othersContainer.innerHTML = '';

                let totalRecebido = 0;
                let totalProvisionado = 0;
                let totalMetaHoje = 0;

                dataRanking.forEach((item, index) => {
                    const recebido = parseNumber(item.recebido);
                    const provisionado = parseNumber(item.provisionado);
                    let realizado = parseNumber(item.realizado);
                    if (realizado < 2 && realizado > 0) realizado = realizado * 100;

                    const metaHoje = parseNumber(item.meta_hoje);
                    let realizadoHoje = parseNumber(item.realizado_hoje);
                    if (realizadoHoje < 2 && realizadoHoje > 0) realizadoHoje = realizadoHoje * 100;

                    totalRecebido += recebido;
                    totalProvisionado += provisionado;
                    totalMetaHoje += metaHoje;

                    const rankPos = parseInt(item.rank) || (index + 1);
                    const avatarUrl = item.foto || 'https://via.placeholder.com/150';
                    const isDailyAchieved = realizadoHoje >= 100;
                    const isMonthAchieved = realizado >= 100;
                    const widthHoje = Math.min(realizadoHoje, 100);
                    const widthMes = Math.min(realizado, 100);

                    const badgeOnTrackPodium = isDailyAchieved ? `
                        <div class="wax-seal" title="Meta Diária Atingida!">
                            <div class="wax-seal-inner">
                                <span class="wax-seal-text-on">ON</span>
                                <span class="wax-seal-text-track">TRACK</span>
                            </div>
                        </div>
                    ` : '';

                    const badgeOnTrackList = isDailyAchieved ? `
                        <div class="wax-seal-list" title="Meta Diária Atingida!">
                            <div class="wax-seal-inner">
                                <span class="wax-seal-text-on">ON</span>
                                <span class="wax-seal-text-track">TRACK</span>
                            </div>
                        </div>
                    ` : '';

                    if (rankPos <= 3) {
                        const step = document.createElement('div');
                        step.className = `podium-step step-${rankPos}`;
                        step.innerHTML = `
                            <div class="podium-badge">${rankPos}º</div>
                            <div class="podium-top-group">
                                <div class="podium-avatar-wrap">
                                    <img src="${avatarUrl}" class="podium-avatar" alt="${item.hunter}">
                                    ${badgeOnTrackPodium}
                                </div>
                                <div class="hunter-name">${item.hunter}</div>
                            </div>
                            <div class="podium-val-group">
                                <span class="podium-val-title">Realizado</span>
                                <div class="podium-val">${formatBRL(recebido)}</div>
                                
                                <!-- Divisão: HOJE e MÊS com caixinha de % preenchida -->
                                <div class="podium-split-grid">
                                    <div class="podium-split-col ${isDailyAchieved ? 'achieved' : ''}">
                                        <span class="split-tag">Hoje</span>
                                        <span class="split-meta">${formatBRLCompact(metaHoje)}</span>
                                        <div class="split-pct ${isDailyAchieved ? 'achieved' : ''}">
                                            <div class="pct-bar-fill fill-hoje ${isDailyAchieved ? 'achieved-fill' : ''}" style="width: ${widthHoje}%;"></div>
                                            <span class="pct-text-val">${realizadoHoje.toFixed(1)}%</span>
                                        </div>
                                    </div>
                                    <div class="podium-split-col ${isMonthAchieved ? 'achieved' : ''}">
                                        <span class="split-tag">Mês</span>
                                        <span class="split-meta">${formatBRLCompact(provisionado)}</span>
                                        <div class="split-pct ${isMonthAchieved ? 'achieved' : ''}">
                                            <div class="pct-bar-fill fill-mes ${isMonthAchieved ? 'achieved-fill' : ''}" style="width: ${widthMes}%;"></div>
                                            <span class="pct-text-val">${realizado.toFixed(1)}%</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        podiumContainer.appendChild(step);
                    } else {
                        const card = document.createElement('div');
                        card.className = 'ranking-card';
                        card.innerHTML = `
                            <div class="badge-rank-list">${rankPos}</div>
                            <div class="avatar-wrap-list">
                                <img src="${avatarUrl}" class="avatar-list" alt="${item.hunter}">
                                ${badgeOnTrackList}
                            </div>
                            
                            <!-- Nome e Realizado -->
                            <div class="hunter-main-info">
                                <div class="hunter-name">${item.hunter}</div>
                                <div class="val-recebido">${formatBRL(recebido)}</div>
                            </div>
                            
                            <!-- Divisão: HOJE e MÊS com caixinha de % preenchida -->
                            <div class="list-split-group">
                                <div class="list-split-box ${isDailyAchieved ? 'achieved' : ''}">
                                    <div class="list-split-meta-wrap">
                                        <span class="list-split-tag">Hoje</span>
                                        <span class="list-split-meta">${formatBRLCompact(metaHoje)}</span>
                                    </div>
                                    <div class="list-split-pct ${isDailyAchieved ? 'achieved' : ''}">
                                        <div class="pct-bar-fill fill-hoje ${isDailyAchieved ? 'achieved-fill' : ''}" style="width: ${widthHoje}%;"></div>
                                        <span class="pct-text-val">${realizadoHoje.toFixed(1)}%</span>
                                    </div>
                                </div>

                                <div class="list-split-box ${isMonthAchieved ? 'achieved' : ''}">
                                    <div class="list-split-meta-wrap">
                                        <span class="list-split-tag">Mês</span>
                                        <span class="list-split-meta">${formatBRLCompact(provisionado)}</span>
                                    </div>
                                    <div class="list-split-pct ${isMonthAchieved ? 'achieved' : ''}">
                                        <div class="pct-bar-fill fill-mes ${isMonthAchieved ? 'achieved-fill' : ''}" style="width: ${widthMes}%;"></div>
                                        <span class="pct-text-val">${realizado.toFixed(1)}%</span>
                                    </div>
                                </div>
                            </div>
                        `;
                        othersContainer.appendChild(card);
                    }
                });

                // Preenchimento dos 2 Cards Consolidados (HOJE e MÊS)
                // Card HOJE
                document.getElementById('kpi-hoje-recebido').innerText = formatBRL(totalRecebido);
                document.getElementById('kpi-hoje-meta').innerText = formatBRL(totalMetaHoje);

                const pctHojeGeral = totalMetaHoje > 0 ? (totalRecebido / totalMetaHoje) * 100 : 0;
                const pctHojeEl = document.getElementById('kpi-pct-hoje');
                pctHojeEl.innerText = `${pctHojeGeral.toFixed(1)}%`;
                if (pctHojeGeral >= 100) {
                    pctHojeEl.classList.add('achieved');
                }

                const hojeBar = document.getElementById('kpi-hoje-bar');
                hojeBar.style.width = `${Math.min(pctHojeGeral, 100)}%`;
                if (pctHojeGeral >= 100) {
                    hojeBar.style.background = 'var(--green)';
                    hojeBar.style.boxShadow = '0 0 15px var(--green-glow)';
                }

                // Card MÊS
                document.getElementById('kpi-recebido').innerText = formatBRL(totalRecebido);
                document.getElementById('kpi-provisionado').innerText = formatBRL(Math.round(totalProvisionado));

                const pctGeral = totalProvisionado > 0 ? (totalRecebido / totalProvisionado) * 100 : 0;
                const mesPctEl = document.getElementById('kpi-realizado');
                mesPctEl.innerText = `${pctGeral.toFixed(2)}%`;
                if (pctGeral >= 100) {
                    mesPctEl.classList.add('achieved');
                }

                const fillBar = document.getElementById('kpi-overall-fill');
                fillBar.style.width = `${Math.min(pctGeral, 100)}%`;
                if (pctGeral >= 100) {
                    fillBar.style.background = 'var(--green)';
                    fillBar.style.boxShadow = '0 0 15px var(--green-glow)';
                }

            } catch (err) {
                console.error("Erro geral no sistema:", err);
            }
        }

        render();
    </script>
</body>
</html>
