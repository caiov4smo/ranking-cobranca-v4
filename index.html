<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Hunters - V4 Company</title>
    <meta http-equiv="refresh" content="600">
    <style>
        :root {
            --bg: #030303;
            --card-bg: #0a0a0a;
            --v4-red: #ed1c24;
            --v4-red-glow: rgba(237, 28, 36, 0.5);
            --border: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #777777;
            --green: #22c55e;
            --gold: #ffd700;
            --silver: #e2e8f0;
            --bronze: #cd7f32;
        }

        /* Zera cantos arredondados em toda a aplicação (Sharp Edges) */
        * {
            box-sizing: border-box;
            border-radius: 0px !important;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
        }

        /* Top Header com Logo à direita */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--v4-red);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 2.2em;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .header h1 span {
            color: var(--v4-red);
        }

        .logo-v4 {
            height: 45px;
            object-fit: contain;
        }

        /* Grid de KPIs */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 35px;
        }

        .kpi-card {
            background: var(--card-bg);
            padding: 18px;
            border: 1px solid var(--border);
            border-left: 3px solid var(--v4-red);
            text-align: left;
        }

        .kpi-card span {
            display: block;
            font-size: 0.7em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .kpi-card strong {
            font-size: 1.6em;
            font-weight: 900;
        }

        /* Lista de Ranking */
        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ranking-card {
            background: var(--card-bg);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 18px;
            border: 1px solid var(--border);
            border-left: 4px solid #333;
            transition: all 0.2s ease;
        }

        .ranking-card:hover {
            border-color: var(--v4-red);
            transform: translateX(6px);
        }

        /* Estilização Extrema do TOP 3 */
        .card-top-1 {
            background: linear-gradient(90deg, rgba(237,28,36,0.15) 0%, #0d0d0d 100%);
            border: 1px solid var(--v4-red);
            border-left: 8px solid var(--v4-red);
            padding: 22px 24px;
            box-shadow: 0 0 25px var(--v4-red-glow);
        }

        .card-top-2 {
            border-left: 6px solid var(--silver);
            padding: 18px 22px;
            background: #0f0f0f;
        }

        .card-top-3 {
            border-left: 6px solid var(--bronze);
            padding: 16px 20px;
            background: #0d0d0d;
        }

        /* Badges dos Posições */
        .badge-rank {
            font-size: 1.2em;
            font-weight: 900;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #151515;
            color: #fff;
            border: 1px solid #333;
        }

        .badge-1 { background: var(--v4-red); color: #fff; border: none; font-size: 1.4em; }
        .badge-2 { background: var(--silver); color: #000; border: none; }
        .badge-3 { background: var(--bronze); color: #fff; border: none; }

        /* Fotos em Quadrado (Sharp) */
        .avatar {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .card-top-1 .avatar {
            width: 60px;
            height: 60px;
            border: 2px solid var(--v4-red);
        }

        .hunter-info {
            flex-grow: 1;
        }

        .hunter-name {
            font-weight: 800;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .card-top-1 .hunter-name {
            font-size: 1.3em;
            color: #fff;
        }

        /* Barra de Progresso Reta */
        .progress-bar-bg {
            background: #1a1a1a;
            height: 6px;
            width: 100%;
            max-width: 250px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--v4-red);
            height: 100%;
        }

        .card-top-1 .progress-bar-fill {
            box-shadow: 0 0 10px var(--v4-red);
        }

        /* Métricas */
        .metrics {
            text-align: right;
            min-width: 150px;
        }

        .val-recebido {
            font-size: 1.15em;
            font-weight: 900;
            color: var(--green);
        }

        .card-top-1 .val-recebido {
            font-size: 1.4em;
        }

        .val-meta {
            font-size: 0.75em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 2px;
        }

        .pct-realizado {
            font-size: 0.85em;
            font-weight: 800;
            color: var(--v4-red);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header com Título e Logo -->
        <div class="header">
            <h1>RANKING <span>HUNTERS</span></h1>
            <img src="./logo-v4.jpg" class="logo-v4" alt="V4 Company" onerror="this.style.display='none'">
        </div>

        <!-- KPIs Totais -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <span>Total Recebido</span>
                <strong id="kpi-recebido" style="color: var(--green);">R$ 0,00</strong>
            </div>
            <div class="kpi-card">
                <span>Total Provisionado</span>
                <strong id="kpi-provisionado">R$ 0,00</strong>
            </div>
            <div class="kpi-card">
                <span>Realizado Geral</span>
                <strong id="kpi-realizado" style="color: var(--v4-red);">0%</strong>
            </div>
        </div>

        <!-- Lista do Ranking -->
        <div class="ranking-list" id="ranking-container">
            <!-- Inserido dinamicamente -->
        </div>
    </div>

    <script>
        const DATA_URL = './dados.json';

        function parseNumber(val) {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            return parseFloat(String(val).replace(/\./g, '').replace(',', '.').replace('%', '').trim()) || 0;
        }

        function formatBRL(val) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
        }

        async function render() {
            try {
                const res = await fetch(DATA_URL);
                const data = await res.json();

                const container = document.getElementById('ranking-container');
                container.innerHTML = '';

                let totalRecebido = 0;
                let totalProvisionado = 0;

                data.forEach((item, index) => {
                    const recebido = parseNumber(item.recebido);
                    const provisionado = parseNumber(item.provisionado);
                    let realizado = parseNumber(item.realizado);

                    if (realizado < 2 && realizado > 0) realizado = realizado * 100;

                    totalRecebido += recebido;
                    totalProvisionado += provisionado;

                    const rankPos = item.rank || (index + 1);
                    
                    let cardClass = 'ranking-card';
                    let badgeClass = 'badge-rank';

                    if (rankPos == 1) {
                        cardClass += ' card-top-1';
                        badgeClass += ' badge-1';
                    } else if (rankPos == 2) {
                        cardClass += ' card-top-2';
                        badgeClass += ' badge-2';
                    } else if (rankPos == 3) {
                        cardClass += ' card-top-3';
                        badgeClass += ' badge-3';
                    }

                    const avatarUrl = item.foto || 'https://via.placeholder.com/150';

                    const card = document.createElement('div');
                    card.className = cardClass;
                    card.innerHTML = `
                        <div class="${badgeClass}">#${rankPos}</div>
                        <img src="${avatarUrl}" class="avatar" alt="${item.hunter}">
                        <div class="hunter-info">
                            <div class="hunter-name">${item.hunter}</div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${Math.min(realizado, 100)}%;"></div>
                            </div>
                        </div>
                        <div class="metrics">
                            <div class="val-recebido">${formatBRL(recebido)}</div>
                            <div class="val-meta">Meta: ${formatBRL(provisionado)}</div>
                            <div class="pct-realizado">${realizado.toFixed(2)}% realizado</div>
                        </div>
                    `;
                    container.appendChild(card);
                });

                document.getElementById('kpi-recebido').innerText = formatBRL(totalRecebido);
                document.getElementById('kpi-provisionado').innerText = formatBRL(totalProvisionado);
                const pctGeral = totalProvisionado > 0 ? (totalRecebido / totalProvisionado) * 100 : 0;
                document.getElementById('kpi-realizado').innerText = `${pctGeral.toFixed(2)}%`;

            } catch (err) {
                console.error("Erro ao carregar ranking:", err);
            }
        }

        render();
    </script>
</body>
</html>
