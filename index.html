<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./favicon.png">
    <title>Ranking Cobrança - V4 Company</title>
    <meta http-equiv="refresh" content="600">
    <style>
        :root {
            --bg: #030303;
            --card-bg: #0a0a0a;
            --v4-red: #ed1c24;
            --v4-red-glow: rgba(237, 28, 36, 0.4);
            --border: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #777777;
            --green: #52cc5a; 
            --green-glow: rgba(82, 204, 90, 0.4);
            --gold-v4: #ffc02a;
            --gold-v4-glow: rgba(255, 192, 42, 0.25);
            --silver: #e2e8f0;
            --bronze: #cd7f32;
        }

        * {
            box-sizing: border-box;
            border-radius: 0px !important;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tv-board {
            width: 1280px;
            height: 720px;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            padding: 20px 25px;
            transform-origin: center center;
        }

        /* Header */
        .header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--v4-red);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 2em;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
            color: var(--v4-red);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #mes-atual {
            font-size: 1.1em;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .logo-v4 { 
            height: 42px; 
            object-fit: contain; 
        }

        /* Layout Principal 20% / 80% */
        .main-content {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            min-height: 0;
        }

        /* LATERAL ESQUERDA (Destaques) */
        .left-panel {
            width: 20%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .highlight-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-top: 4px solid var(--gold-v4);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .highlight-header {
            background: #111;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border);
        }

        .highlight-header h2 {
            margin: 0;
            color: var(--gold-v4);
            font-size: 0.95em;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .highlight-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: linear-gradient(180deg, rgba(255,192,42,0.05) 0%, #050505 100%);
            text-align: center;
            overflow: hidden;
        }

        .highlight-avatar {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 2px solid var(--gold-v4);
            margin-bottom: 10px;
            box-shadow: 0 5px 15px var(--gold-v4-glow);
        }

        .highlight-name {
            font-size: 1.1em;
            font-weight: 900;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .highlight-label {
            color: var(--text-muted);
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .highlight-val {
            font-size: 1.4em;
            font-weight: 900;
            color: var(--green);
        }

        /* LATERAL DIREITA */
        .right-panel {
            width: 80%;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-width: 0;
        }

        /* KPIs */
        .kpi-grid {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .kpi-card {
            background: var(--card-bg);
            padding: 15px 20px;
            border: 1px solid var(--border);
            border-left: 3px solid var(--v4-red);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .kpi-card span {
            display: block;
            font-size: 0.7em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .kpi-card strong {
            font-size: 1.6em;
            font-weight: 900;
        }

        .kpi-card-realizado { position: relative; }
        .kpi-realizado-content {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .kpi-bar-overall-bg {
            background: #1a1a1a;
            height: 8px;
            width: 100%;
            overflow: hidden;
            border: 1px solid #222;
        }

        .kpi-bar-overall-fill {
            background: linear-gradient(90deg, var(--v4-red) 0%, var(--green) 100%);
            height: 100%;
            width: 0%;
            transition: width 0.8s ease-in-out;
            box-shadow: 0 0 12px var(--v4-red-glow);
        }

        /* Pódio (Top 3) - Ajuste de Altura e Espaçamentos */
        .podium-wrapper {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 15px;
        }

        .podium-step {
            background: linear-gradient(180deg, #111111 0%, #050505 100%);
            border: 1px solid var(--border);
            width: 32%;
            max-width: 330px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 10px 12px; /* Reduzido padding superior de 40px para 30px */
            position: relative;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .step-1 { 
            order: 2; 
            height: 290px; 
            border-top: 4px solid var(--v4-red); 
            box-shadow: 0 -15px 40px var(--v4-red-glow);
            z-index: 2;
            padding-top: 42px;
        }
        
        .step-2 { 
            order: 1; 
            height: 265px; 
            border-top: 4px solid var(--silver); 
        }

        .step-3 { 
            order: 3; 
            height: 245px; /* Aumentado de 220px para 245px */
            border-top: 4px solid var(--bronze); 
        }

        .podium-step:hover { transform: translateY(-5px); }

        .podium-avatar {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border: 2px solid #333;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .step-1 .podium-avatar { width: 80px; height: 80px; border-color: var(--v4-red); }
        .step-2 .podium-avatar { border-color: var(--silver); }
        .step-3 .podium-avatar { border-color: var(--bronze); }

        .podium-badge {
            position: absolute;
            top: -18px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: 900;
            background: #111;
            border: 2px solid;
            color: #fff;
        }
        .step-1 .podium-badge { border-color: var(--v4-red); background: var(--v4-red); top: -22px; width: 44px; height: 44px; font-size: 1.5em; }
        .step-2 .podium-badge { border-color: var(--silver); color: var(--silver); }
        .step-3 .podium-badge { border-color: var(--bronze); color: var(--bronze); }

        .hunter-name {
            font-weight: 800;
            font-size: 0.95em;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 2px 0 6px 0;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
            display: block;
        }

        .step-1 .hunter-name { font-size: 1.2em; color: var(--v4-red); }

        .podium-val {
            font-size: 1.15em;
            font-weight: 900;
            color: var(--green);
            margin-top: auto; 
        }

        .podium-prov {
            font-size: 0.75em;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
            margin-top: 2px;
        }

        .podium-pct {
            font-size: 0.85em;
            font-weight: 800;
            color: var(--text-muted);
            background: #1a1a1a;
            padding: 4px 12px;
        }
        .step-1 .podium-pct { color: #fff; background: var(--v4-red); }

        /* Lista Fixa e Compacta */
        .ranking-list {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 10px; 
            overflow-y: auto;
            padding-right: 10px;
        }

        .ranking-list::-webkit-scrollbar { width: 6px; }
        .ranking-list::-webkit-scrollbar-track { background: transparent; }
        .ranking-list::-webkit-scrollbar-thumb { background: var(--v4-red); }

        .ranking-card {
            flex: 0 0 auto; 
            height: 68px;
            background: var(--card-bg);
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 18px;
            border: 1px solid var(--border);
            border-left: 4px solid #333;
            transition: transform 0.2s ease;
        }

        .ranking-card:hover {
            border-color: #444;
            transform: translateX(4px);
        }

        .badge-rank-list {
            font-size: 1.1em;
            font-weight: 900;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #151515;
            color: var(--text-muted);
            border: 1px solid #333;
            flex-shrink: 0;
        }

        .avatar-list {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border: 1px solid #333;
            flex-shrink: 0;
        }

        .info-list {
            flex-grow: 1;
            min-width: 150px;
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
        }

        .progress-bar-bg {
            background: #1a1a1a;
            height: 6px;
            flex: 1;
            max-width: 450px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--v4-red);
            height: 100%;
        }

        .pct-label-side {
            font-size: 0.85em;
            font-weight: 800;
            color: var(--v4-red);
            white-space: nowrap;
        }

        .metrics-list {
            white-space: nowrap;
            display: grid;
            grid-template-columns: 170px 20px 170px;
            align-items: center;
            flex-shrink: 0;
            margin-left: auto;
        }

        .val-recebido-list {
            font-size: 1.1em;
            font-weight: 900;
            color: var(--green);
            text-align: right;
        }

        .val-divider {
            color: #333;
            font-weight: 800;
            text-align: center;
        }

        .val-provisionado-list {
            font-size: 0.85em;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            text-align: left;
        }
    </style>
</head>
<body>

    <div id="tv-board">
        <div class="header">
            <h1>RANKING COBRANÇA</h1>
            <div class="header-right">
                <span id="mes-atual"></span>
                <img src="./logo-v4.jpg" class="logo-v4" alt="V4 Company" onerror="this.style.display='none'">
            </div>
        </div>

        <div class="main-content">
            
            <div class="left-panel">
                <div class="highlight-card">
                    <div class="highlight-header">
                        <h2>DESTAQUE DE ONTEM</h2>
                    </div>
                    <div class="highlight-body">
                        <img id="yesterday-avatar" class="highlight-avatar" src="https://via.placeholder.com/150" alt="Destaque Ontem">
                        <div id="yesterday-name" class="highlight-name">-</div>
                        <div class="highlight-label">Total Recebido</div>
                        <div id="yesterday-val" class="highlight-val">R$ 0,00</div>
                    </div>
                </div>

                <div class="highlight-card">
                    <div class="highlight-header">
                        <h2>DESTAQUE DA SEMANA</h2>
                    </div>
                    <div class="highlight-body">
                        <img id="week-avatar" class="highlight-avatar" src="https://via.placeholder.com/150" alt="Destaque Semana">
                        <div id="week-name" class="highlight-name">-</div>
                        <div class="highlight-label">Total Recebido</div>
                        <div id="week-val" class="highlight-val">R$ 0,00</div>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="kpi-grid">
                    <div class="kpi-card">
                        <span>Realizado</span>
                        <strong id="kpi-recebido" style="color: var(--green);">R$ 0,00</strong>
                    </div>
                    <div class="kpi-card">
                        <span>Meta</span>
                        <strong id="kpi-provisionado">R$ 0,00</strong>
                    </div>
                    
                    <div class="kpi-card kpi-card-realizado">
                        <span>Realizado Geral</span>
                        <div class="kpi-realizado-content">
                            <strong id="kpi-realizado" style="color: var(--green);">0%</strong>
                        </div>
                        <div class="kpi-bar-overall-bg">
                            <div class="kpi-bar-overall-fill" id="kpi-overall-fill"></div>
                        </div>
                    </div>
                </div>

                <div class="podium-wrapper" id="podium-container"></div>
                <div class="ranking-list" id="others-container"></div>
            </div>

        </div>
    </div>

    <script>
        function autoScaleDashboard() {
            const board = document.getElementById('tv-board');
            const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
            board.style.transform = `scale(${scale})`;
        }
        
        window.addEventListener('resize', autoScaleDashboard);
        autoScaleDashboard();

        const DATA_URL_RANKING = './dados.json';
        const DATA_URL_ONTEM = './dados2.json';

        const dataAjustada = new Date();
        dataAjustada.setDate(dataAjustada.getDate() - 3);

        const mesExtenso = dataAjustada.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }).toUpperCase();
        document.getElementById('mes-atual').innerText = mesExtenso;

        function parseNumber(val) {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            return parseFloat(String(val).replace(/\./g, '').replace(',', '.').replace('%', '').trim()) || 0;
        }

        function formatBRL(val) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
        }

        async function render() {
            try {
                let dataRanking = [];
                let dataOntem = [];

                try {
                    const resRank = await fetch(DATA_URL_RANKING);
                    dataRanking = await resRank.json();
                } catch (e) {
                    console.error("Erro ao carregar dados do ranking principal:", e);
                }

                try {
                    const resOntem = await fetch(DATA_URL_ONTEM);
                    dataOntem = await resOntem.json();
                } catch (e) {
                    console.error("Erro ao carregar dados do dia anterior:", e);
                }

                if (dataOntem && dataOntem.length > 0) {
                    const tops = dataOntem[0];
                    
                    const nomeOntem = tops.top_hunter_ontem || 'Sem Pagamentos';
                    const valorOntem = parseNumber(tops.recebido_ontem_val);
                    const hunterOntemObj = dataRanking.find(d => d.hunter === nomeOntem);
                    
                    document.getElementById('yesterday-name').innerText = nomeOntem;
                    document.getElementById('yesterday-val').innerText = formatBRL(valorOntem);
                    document.getElementById('yesterday-avatar').src = hunterOntemObj ? hunterOntemObj.foto : 'https://via.placeholder.com/150';

                    const nomeSemana = tops.top_hunter_semana || 'Sem Pagamentos';
                    const valorSemana = parseNumber(tops.recebido_semana_val);
                    const hunterSemanaObj = dataRanking.find(d => d.hunter === nomeSemana);
                    
                    document.getElementById('week-name').innerText = nomeSemana;
                    document.getElementById('week-val').innerText = formatBRL(valorSemana);
                    document.getElementById('week-avatar').src = hunterSemanaObj ? hunterSemanaObj.foto : 'https://via.placeholder.com/150';
                }

                const podiumContainer = document.getElementById('podium-container');
                const othersContainer = document.getElementById('others-container');
                podiumContainer.innerHTML = '';
                othersContainer.innerHTML = '';

                let totalRecebido = 0;
                let totalProvisionado = 0;

                dataRanking.forEach((item, index) => {
                    const recebido = parseNumber(item.recebido);
                    const provisionado = parseNumber(item.provisionado);
                    let realizado = parseNumber(item.realizado);

                    if (realizado < 2 && realizado > 0) realizado = realizado * 100;

                    totalRecebido += recebido;
                    totalProvisionado += provisionado;

                    const rankPos = item.rank || (index + 1);
                    const avatarUrl = item.foto || 'https://via.placeholder.com/150';

                    if (rankPos <= 3) {
                        const step = document.createElement('div');
                        step.className = `podium-step step-${rankPos}`;
                        step.innerHTML = `
                            <div class="podium-badge">${rankPos}º</div>
                            <img src="${avatarUrl}" class="podium-avatar" alt="${item.hunter}">
                            <div class="hunter-name">${item.hunter}</div>
                            <div class="podium-val">${formatBRL(recebido)}</div>
                            <div class="podium-prov">${formatBRL(provisionado)}</div>
                            <div class="podium-pct">${realizado.toFixed(2)}%</div>
                        `;
                        podiumContainer.appendChild(step);
                    } else {
                        const card = document.createElement('div');
                        card.className = 'ranking-card';
                        card.innerHTML = `
                            <div class="badge-rank-list">${rankPos}</div>
                            <img src="${avatarUrl}" class="avatar-list" alt="${item.hunter}">
                            <div class="info-list">
                                <div class="hunter-name" style="font-size: 1em;">${item.hunter}</div>
                                <div class="progress-row">
                                    <div class="progress-bar-bg">
                                        <div class="progress-bar-fill" style="width: ${Math.min(realizado, 100)}%;"></div>
                                    </div>
                                    <span class="pct-label-side">${realizado.toFixed(2)}%</span>
                                </div>
                            </div>
                            <div class="metrics-list">
                                <span class="val-recebido-list">${formatBRL(recebido)}</span>
                                <span class="val-divider">/</span>
                                <span class="val-provisionado-list">${formatBRL(provisionado)}</span>
                            </div>
                        `;
                        othersContainer.appendChild(card);
                    }
                });

                document.getElementById('kpi-recebido').innerText = formatBRL(totalRecebido);
                document.getElementById('kpi-provisionado').innerText = formatBRL(Math.round(totalProvisionado));
                
                const pctGeral = totalProvisionado > 0 ? (totalRecebido / totalProvisionado) * 100 : 0;
                document.getElementById('kpi-realizado').innerText = `${pctGeral.toFixed(2)}%`;
                
                const fillBar = document.getElementById('kpi-overall-fill');
                fillBar.style.width = `${Math.min(pctGeral, 100)}%`;
                
                if (pctGeral >= 100) {
                    fillBar.style.background = 'var(--green)';
                    fillBar.style.boxShadow = '0 0 15px var(--green-glow)';
                }

            } catch (err) {
                console.error("Erro geral no sistema:", err);
            }
        }

        render();
    </script>
</body>
</html>
