<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Cobrança - V4 Company</title>
    <meta http-equiv="refresh" content="600">
    <style>
        :root {
            --bg: #030303;
            --card-bg: #0a0a0a;
            --v4-red: #ed1c24;
            --v4-red-glow: rgba(237, 28, 36, 0.4);
            --border: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #777777;
            --green: #22c55e;
            --silver: #e2e8f0;
            --bronze: #cd7f32;
        }

        * {
            box-sizing: border-box;
            border-radius: 0px !important;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* O novo contêiner mestre que divide a tela em Esquerda (Conteúdo) e Direita (Foguete) */
        .dashboard-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
            padding: 2.5vh 2vw;
            gap: 2vw;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ======= COLUNA ESQUERDA (70%) ======= */
        .col-left {
            flex: 0 0 70%;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Header */
        .header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--v4-red);
            padding-bottom: 1.5vh;
            margin-bottom: 3vh;
        }

        .header h1 {
            margin: 0;
            font-size: 2em;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
            color: var(--v4-red);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #mes-atual {
            font-size: 1.1em;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* KPIs de Valor (Agora só 2 colunas, pois a % foi pra direita) */
        .kpi-grid {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 3.5vh;
        }

        .kpi-card {
            background: var(--card-bg);
            padding: 2vh 20px;
            border: 1px solid var(--border);
            border-left: 3px solid var(--v4-red);
        }

        .kpi-card span {
            display: block;
            font-size: 0.7em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .kpi-card strong {
            font-size: 1.6em;
            font-weight: 900;
        }

        /* Pódio (Top 3) */
        .podium-wrapper {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 3.5vh;
        }

        .podium-step {
            background: linear-gradient(180deg, #111111 0%, #050505 100%);
            border: 1px solid var(--border);
            width: 32%;
            max-width: 330px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 25px 12px 15px;
            position: relative;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .podium-step:hover { transform: translateY(-5px); }

        .podium-avatar {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border: 2px solid #333;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .step-1 { order: 2; height: 31vh; min-height: 290px; border-top: 4px solid var(--v4-red); box-shadow: 0 -15px 40px var(--v4-red-glow); z-index: 2;}
        .step-1 .podium-avatar { width: 85px; height: 85px; border-color: var(--v4-red); }
        .step-1 .hunter-name { font-size: 1.25em; color: var(--v4-red); }
        .step-2 { order: 1; height: 27vh; min-height: 260px; border-top: 4px solid var(--silver); }
        .step-2 .podium-avatar { border-color: var(--silver); }
        .step-3 { order: 3; height: 25vh; min-height: 240px; border-top: 4px solid var(--bronze); }
        .step-3 .podium-avatar { border-color: var(--bronze); }

        .podium-badge { position: absolute; top: -20px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 1.3em; font-weight: 900; background: #111; border: 2px solid; color: #fff; }
        .step-1 .podium-badge { border-color: var(--v4-red); background: var(--v4-red); top: -25px; width: 50px; height: 50px; font-size: 1.6em; }
        .step-2 .podium-badge { border-color: var(--silver); color: var(--silver); }
        .step-3 .podium-badge { border-color: var(--bronze); color: var(--bronze); }

        .hunter-name { font-weight: 800; font-size: 1em; line-height: 1.2; text-transform: uppercase; letter-spacing: 0.5px; margin: 4px 0; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .podium-val { font-size: 1.2em; font-weight: 900; color: var(--green); margin-top: 2px; }
        .podium-prov { font-size: 0.75em; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .podium-pct { font-size: 0.85em; font-weight: 800; color: var(--text-muted); background: #1a1a1a; padding: 4px 12px; }
        .step-1 .podium-pct { color: #fff; background: var(--v4-red); }

        /* Lista (4º em diante) */
        .ranking-list { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: 1vh; overflow-y: auto; padding-right: 10px; }
        .ranking-list::-webkit-scrollbar { width: 6px; }
        .ranking-list::-webkit-scrollbar-track { background: transparent; }
        .ranking-list::-webkit-scrollbar-thumb { background: var(--v4-red); }

        .ranking-card { flex: 1; max-height: 85px; min-height: 60px; background: var(--card-bg); padding: 1vh 20px; display: flex; align-items: center; gap: 18px; border: 1px solid var(--border); border-left: 4px solid #333; transition: transform 0.2s ease; }
        .ranking-card:hover { border-color: #444; transform: translateX(4px); }

        .badge-rank-list { font-size: 1.1em; font-weight: 900; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; background: #151515; color: var(--text-muted); border: 1px solid #333; flex-shrink: 0; }
        .avatar-list { width: 45px; height: 45px; object-fit: cover; border: 1px solid #333; flex-shrink: 0; }
        .info-list { flex-grow: 1; min-width: 150px; }
        
        .progress-row { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
        .progress-bar-bg { background: #1a1a1a; height: 6px; flex: 1; max-width: 400px; overflow: hidden; }
        .progress-bar-fill { background: var(--v4-red); height: 100%; }
        .pct-label-side { font-size: 0.85em; font-weight: 800; color: var(--v4-red); white-space: nowrap; }

        .metrics-list { white-space: nowrap; display: grid; grid-template-columns: 140px 14px 140px; align-items: center; flex-shrink: 0; margin-left: auto; }
        .val-recebido-list { font-size: 1em; font-weight: 900; color: var(--green); text-align: right; }
        .val-divider { color: #333; font-weight: 800; text-align: center; }
        .val-provisionado-list { font-size: 0.75em; font-weight: 700; color: var(--text-muted); text-transform: uppercase; text-align: left; }


        /* ======= COLUNA DIREITA (30%) - O FOGUETE ======= */
        .col-right {
            flex: 0 0 28%; /* Pegando quase 30% da tela */
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border: 1px solid var(--border);
            height: 100%;
            position: relative;
            overflow: hidden;
            border-top: 4px solid var(--v4-red);
        }

        /* Área do Título e Logo */
        .rocket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(0,0,0,0.5);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }
        
        .rocket-header span {
            font-size: 0.8em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        /* O container mestre da imagem */
        .rocket-container {
            flex-grow: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* A imagem esfumaçada no fundo (Preto e branco, pouca opacidade) */
        .rocket-ghost {
            position: absolute;
            height: 85%;
            width: auto;
            object-fit: contain;
            opacity: 0.15;
            filter: grayscale(100%);
            z-index: 1;
        }

        /* A imagem colorida (O "Combustível") */
        .rocket-color {
            position: absolute;
            height: 85%;
            width: auto;
            object-fit: contain;
            z-index: 2;
            /* O pulo do gato: A imagem colorida é "cortada" por baixo via JavaScript dependendo da % */
            clip-path: inset(100% 0 0 0); 
            transition: clip-path 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 0 20px var(--v4-red-glow));
        }

        /* O Texto gigante com a porcentagem rodando solto em cima da imagem */
        .rocket-pct-text {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 5.5em;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px rgba(0,0,0,0.9), 0 5px 10px rgba(0,0,0,0.8);
            z-index: 10;
        }
        
        .rocket-pct-text span {
            font-size: 0.3em;
            display: block;
            color: var(--v4-red);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: -15px;
        }

    </style>
</head>
<body>

    <div class="dashboard-layout">
        
        <!-- ESQUERDA (Tabela de Líderes) -->
        <div class="col-left">
            <div class="header">
                <h1>RANKING COBRANÇA</h1>
                <div class="header-right">
                    <span id="mes-atual"></span>
                </div>
            </div>

            <!-- KPIs -->
            <div class="kpi-grid">
                <div class="kpi-card">
                    <span>Realizado</span>
                    <strong id="kpi-recebido" style="color: var(--green);">R$ 0,00</strong>
                </div>
                <div class="kpi-card">
                    <span>Meta</span>
                    <strong id="kpi-provisionado">R$ 0,00</strong>
                </div>
            </div>

            <!-- Pódio -->
            <div class="podium-wrapper" id="podium-container"></div>

            <!-- Lista -->
            <div class="ranking-list" id="others-container"></div>
        </div>


        <!-- DIREITA (Meta Global Foguete) -->
        <div class="col-right">
            <div class="rocket-header">
                <span>Realizado Geral</span>
                <img src="./logo-v4.jpg" class="logo-v4" alt="V4" onerror="this.style.display='none'">
            </div>
            
            <div class="rocket-container">
                <!-- Certifique-se de subir uma imagem chamada foguete.png no mesmo diretório -->
                <img src="./foguete.png" class="rocket-ghost" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3256/3256083.png'">
                <img src="./foguete.png" class="rocket-color" id="rocket-fill" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3256/3256083.png'">
                
                <div class="rocket-pct-text">
                    <span>Atingimento</span>
                    <div id="kpi-realizado">0%</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const DATA_URL = './dados.json';

        const mesExtenso = new Date().toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }).toUpperCase();
        document.getElementById('mes-atual').innerText = mesExtenso;

        function parseNumber(val) {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            return parseFloat(String(val).replace(/\./g, '').replace(',', '.').replace('%', '').trim()) || 0;
        }

        function formatBRL(val) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
        }

        async function render() {
            try {
                const res = await fetch(DATA_URL);
                const data = await res.json();

                const podiumContainer = document.getElementById('podium-container');
                const othersContainer = document.getElementById('others-container');
                podiumContainer.innerHTML = '';
                othersContainer.innerHTML = '';

                let totalRecebido = 0;
                let totalProvisionado = 0;

                data.forEach((item, index) => {
                    const recebido = parseNumber(item.recebido);
                    const provisionado = parseNumber(item.provisionado);
                    let realizado = parseNumber(item.realizado);

                    if (realizado < 2 && realizado > 0) realizado = realizado * 100;

                    totalRecebido += recebido;
                    totalProvisionado += provisionado;

                    const rankPos = item.rank || (index + 1);
                    const avatarUrl = item.foto || 'https://via.placeholder.com/150';

                    if (rankPos <= 3) {
                        const step = document.createElement('div');
                        step.className = `podium-step step-${rankPos}`;
                        step.innerHTML = `
                            <div class="podium-badge">${rankPos}º</div>
                            <img src="${avatarUrl}" class="podium-avatar" alt="${item.hunter}">
                            <div class="hunter-name">${item.hunter}</div>
                            <div class="podium-val">${formatBRL(recebido)}</div>
                            <div class="podium-prov">${formatBRL(provisionado)}</div>
                            <div class="podium-pct">${realizado.toFixed(2)}%</div>
                        `;
                        podiumContainer.appendChild(step);
                    } else {
                        const card = document.createElement('div');
                        card.className = 'ranking-card';
                        card.innerHTML = `
                            <div class="badge-rank-list">${rankPos}</div>
                            <img src="${avatarUrl}" class="avatar-list" alt="${item.hunter}">
                            <div class="info-list">
                                <div class="hunter-name" style="font-size: 1em;">${item.hunter}</div>
                                <div class="progress-row">
                                    <div class="progress-bar-bg">
                                        <div class="progress-bar-fill" style="width: ${Math.min(realizado, 100)}%;"></div>
                                    </div>
                                    <span class="pct-label-side">${realizado.toFixed(2)}%</span>
                                </div>
                            </div>
                            <div class="metrics-list">
                                <span class="val-recebido-list">${formatBRL(recebido)}</span>
                                <span class="val-divider">/</span>
                                <span class="val-provisionado-list">${formatBRL(provisionado)}</span>
                            </div>
                        `;
                        othersContainer.appendChild(card);
                    }
                });

                // Atualiza KPIs Financeiros
                document.getElementById('kpi-recebido').innerText = formatBRL(totalRecebido);
                document.getElementById('kpi-provisionado').innerText = formatBRL(totalProvisionado);
                
                // Calcula e atualiza Foguete
                const pctGeral = totalProvisionado > 0 ? (totalRecebido / totalProvisionado) * 100 : 0;
                document.getElementById('kpi-realizado').innerText = `${pctGeral.toFixed(2)}%`;
                
                // Animação de Subida do Foguete (Cortando de cima para baixo. Ex: Se tem 60%, a margem superior do corte é 40%)
                const corteSuperior = 100 - Math.min(pctGeral, 100);
                setTimeout(() => {
                    document.getElementById('rocket-fill').style.clipPath = `inset(${corteSuperior}% 0 0 0)`;
                }, 100); // pequeno atraso para a animação disparar após o carregamento

            } catch (err) {
                console.error("Erro ao carregar ranking:", err);
            }
        }

        render();
    </script>
</body>
</html>
