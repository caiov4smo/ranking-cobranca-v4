<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANKING - CASH DAY</title>
    <style>
        :root {
            --bg: #030303;
            --card-bg: #0a0a0a;
            --v4-red: #ed1c24;
            --v4-red-glow: rgba(237, 28, 36, 0.5);
            --border: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #888888;
            --green: #52cc5a; 
            --silver: #e2e8f0;
            --bronze: #cd7f32;
        }

        * {
            box-sizing: border-box;
            border-radius: 0px !important;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tv-board {
            width: 1280px;
            height: 720px;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            padding: 18px 24px;
            transform-origin: center center;
        }

        /* Header */
        .header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--v4-red);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .header h1 {
            margin: 0;
            font-size: 2.2em;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            color: var(--v4-red);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #data-atual {
            font-size: 1.3em;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .logo-v4 {
            height: 36px;
            object-fit: contain;
        }

        /* Layout Principal */
        .main-content {
            display: flex;
            flex-grow: 1;
            min-height: 0;
            gap: 24px;
        }

        .col-left {
            flex: 1.4;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }

        .col-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
            border-left: 1px solid var(--border);
            padding-left: 20px;
        }

        .section-title {
            font-size: 1.35em;
            font-weight: 900;
            color: var(--v4-red);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- PÓDIO UNIDADES --- */
        .podium-wrapper-units {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 12px;
            height: 280px;
            margin-bottom: 10px;
        }

        .podium-step-unit {
            background: linear-gradient(180deg, #141414 0%, #050505 100%);
            border: 1px solid var(--border);
            width: 32%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 6px 14px;
            position: relative;
            text-align: center;
        }

        .podium-step-unit.step-1 { 
            order: 2; 
            height: 270px; 
            border-top: 6px solid var(--v4-red); 
            box-shadow: 0 -20px 50px var(--v4-red-glow);
            z-index: 2;
        }
        
        .podium-step-unit.step-2 { 
            order: 1; 
            height: 235px; 
            border-top: 6px solid var(--silver); 
        }

        .podium-step-unit.step-3 { 
            order: 3; 
            height: 210px; 
            border-top: 6px solid var(--bronze); 
        }

        .podium-step-unit .hunter-name {
            font-weight: 900;
            font-size: 1.35em;
            line-height: 1.15;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            width: 100%;
            text-align: center;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
            margin: auto 0;
            padding: 0 4px;
        }

        .podium-step-unit.step-1 .hunter-name { 
            font-size: 1.6em; 
            color: var(--v4-red); 
        }

        /* --- PÓDIO REGIONAIS (FONTE MUITO MAIOR) --- */
        .podium-wrapper-regionals {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            height: 280px;
            margin-bottom: 10px;
        }

        .podium-step-reg {
            background: linear-gradient(180deg, #141414 0%, #050505 100%);
            border: 1px solid var(--border);
            width: 31%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 4px 14px;
            position: relative;
            text-align: center;
        }

        .podium-step-reg.step-1 { 
            order: 2; 
            height: 270px; 
            border-top: 6px solid var(--v4-red); 
            box-shadow: 0 -20px 50px var(--v4-red-glow);
            z-index: 2;
        }
        
        .podium-step-reg.step-2 { 
            order: 1; 
            height: 235px; 
            border-top: 6px solid var(--silver); 
        }

        .podium-step-reg.step-3 { 
            order: 3; 
            height: 210px; 
            border-top: 6px solid var(--bronze); 
        }

        .podium-step-reg .hunter-name {
            font-weight: 900;
            font-size: 2.2em;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            margin: auto 0;
            padding: 0 2px;
        }

        .podium-step-reg.step-1 .hunter-name { 
            font-size: 2.7em; 
            color: var(--v4-red); 
        }

        /* Badges Hero */
        .podium-badge {
            position: absolute;
            top: -18px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25em;
            font-weight: 900;
            background: #111;
            border: 2px solid;
            color: #fff;
        }
        .step-1 .podium-badge { border-color: var(--v4-red); background: var(--v4-red); top: -22px; width: 48px; height: 48px; font-size: 1.55em; }
        .step-2 .podium-badge { border-color: var(--silver); color: var(--silver); }
        .step-3 .podium-badge { border-color: var(--bronze); color: var(--bronze); }

        .podium-pct-box {
            font-size: 1.75em;
            font-weight: 900;
            color: var(--green);
            background: #151515;
            border: 1px solid #282828;
            padding: 8px 10px;
            text-align: center;
            width: 95%;
            margin-top: auto;
        }
        .step-1 .podium-pct-box { color: #fff; background: var(--v4-red); border-color: var(--v4-red); font-size: 2.1em; }

        /* --- LISTAS SECUNDÁRIAS --- */
        .ranking-list {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 8px; 
            overflow: hidden;
        }

        .ranking-card {
            flex: 0 0 auto; 
            height: 56px;
            background: var(--card-bg);
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            border: 1px solid var(--border);
            border-left: 4px solid #333;
            transition: transform 0.2s ease;
        }

        .ranking-card:hover {
            border-color: #444;
            transform: translateX(3px);
        }

        .card-left-group {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
            flex: 1;
        }

        .badge-rank-list {
            font-size: 1.15em;
            font-weight: 900;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #151515;
            color: var(--text-main);
            border: 1px solid #333;
            flex-shrink: 0;
        }

        /* Fonte das Unidades na Lista (Aumentada um pouco) */
        .col-left .hunter-name-list {
            font-weight: 900;
            font-size: 1.5em;
            color: var(--text-main);
            text-align: left;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* Fonte das Regionais na Lista (AUMENTADA BASTANTE) */
        .col-right .hunter-name-list {
            font-weight: 900;
            font-size: 1.85em;
            color: var(--text-main);
            text-align: left;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pct-label-pure {
            font-size: 1.55em;
            font-weight: 900;
            color: var(--green);
            white-space: nowrap;
            text-align: right;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        .error-msg {
            color: var(--v4-red);
            font-weight: 800;
            text-align: center;
            font-size: 0.9em;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div id="tv-board">
        <!-- Header -->
        <div class="header">
            <h1>RANKING - CASH DAY</h1>
            <div class="header-right">
                <span id="data-atual">10/09/2026</span>
                <img src="./logo-v4.jpg" class="logo-v4" alt="V4 Company" onerror="this.style.display='none'">
            </div>
        </div>

        <div class="main-content">
            
            <!-- ESQUERDA: RANKING POR UNIDADE (TOP 6) -->
            <div class="col-left">
                <div class="section-title">UNIDADES</div>
                <div class="podium-wrapper-units" id="units-podium-container"></div>
                <div class="ranking-list" id="units-others-container"></div>
            </div>

            <!-- DIREITA: RANKING POR REGIONAL (TOP 6) -->
            <div class="col-right">
                <div class="section-title">REGIONAL</div>
                <div class="podium-wrapper-regionals" id="regionals-podium-container"></div>
                <div class="ranking-list" id="regionals-others-container"></div>
            </div>

        </div>
    </div>

    <script>
        function autoScaleDashboard() {
            const board = document.getElementById('tv-board');
            const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
            board.style.transform = `scale(${scale})`;
        }
        
        window.addEventListener('resize', autoScaleDashboard);
        autoScaleDashboard();

        // Remove o prefixo "V4 Company" ou "V4" dos nomes das UNIDADES
        function cleanName(rawName) {
            if (!rawName) return '';
            return rawName.replace(/^V4\s*(Company)?\s*/i, '').trim() || rawName;
        }

        async function fetchAndRenderDashboard() {
            // --- 1. CARREGA UNIDADES (dados.json - TOP 6) ---
            const unitsPodium = document.getElementById('units-podium-container');
            const unitsOthers = document.getElementById('units-others-container');

            try {
                const resUnits = await fetch('./dados.json');
                if (!resUnits.ok) throw new Error("Erro ao carregar dados.json");
                const dataUnits = await resUnits.json();
                
                // Corta estritamente nas 6 primeiras posições (Pódio + 3)
                const top6Units = dataUnits.slice(0, 6);

                unitsPodium.innerHTML = '';
                unitsOthers.innerHTML = '';

                top6Units.forEach((item, index) => {
                    const rank = index + 1;
                    const rawName = item.unidade || item.nome || 'Unidade';
                    const nome = cleanName(rawName);
                    const pct = item['%'] || '0,00%';

                    if (rank <= 3) {
                        const step = document.createElement('div');
                        step.className = `podium-step-unit step-${rank}`;
                        step.innerHTML = `
                            <div class="podium-badge">${rank}º</div>
                            <div class="hunter-name" title="${nome}">${nome}</div>
                            <div class="podium-pct-box">${pct}</div>
                        `;
                        unitsPodium.appendChild(step);
                    } else {
                        const card = document.createElement('div');
                        card.className = 'ranking-card';
                        card.innerHTML = `
                            <div class="card-left-group">
                                <div class="badge-rank-list">${rank}</div>
                                <div class="hunter-name-list" title="${nome}">${nome}</div>
                            </div>
                            <span class="pct-label-pure">${pct}</span>
                        `;
                        unitsOthers.appendChild(card);
                    }
                });

            } catch (err) {
                console.error("Erro Unidades:", err);
                unitsOthers.innerHTML = `<div class="error-msg">Aguardando dados.json...</div>`;
            }

            // --- 2. CARREGA REGIONAIS (dados2.json - TOP 6) ---
            const regPodium = document.getElementById('regionals-podium-container');
            const regOthers = document.getElementById('regionals-others-container');

            try {
                const resReg = await fetch('./dados2.json');
                if (!resReg.ok) throw new Error("Erro ao carregar dados2.json");
                const dataReg = await resReg.json();
                
                // Corta estritamente nas 6 primeiras posições (Pódio + 3)
                const top6Reg = dataReg.slice(0, 6);

                regPodium.innerHTML = '';
                regOthers.innerHTML = '';

                top6Reg.forEach((item, index) => {
                    const rank = index + 1;
                    const nome = item.regional || item.unidade || item.nome || 'Regional';
                    const pct = item['%'] || item.realizado || '0,00%';

                    if (rank <= 3) {
                        const step = document.createElement('div');
                        step.className = `podium-step-reg step-${rank}`;
                        step.innerHTML = `
                            <div class="podium-badge">${rank}º</div>
                            <div class="hunter-name" title="${nome}">${nome}</div>
                            <div class="podium-pct-box">${pct}</div>
                        `;
                        regPodium.appendChild(step);
                    } else {
                        const card = document.createElement('div');
                        card.className = 'ranking-card';
                        card.innerHTML = `
                            <div class="card-left-group">
                                <div class="badge-rank-list">${rank}</div>
                                <div class="hunter-name-list" title="${nome}">${nome}</div>
                            </div>
                            <span class="pct-label-pure">${pct}</span>
                        `;
                        regOthers.appendChild(card);
                    }
                });

            } catch (err) {
                console.error("Erro Regionais:", err);
                regOthers.innerHTML = `<div class="error-msg">Aguardando dados2.json...</div>`;
            }
        }

        fetchAndRenderDashboard();
    </script>
</body>
</html>
