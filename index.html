<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Hunters - V4 Company</title>
    <meta http-equiv="refresh" content="600">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #111111;
            --v4-red: #ed1c24;
            --v4-red-glow: rgba(237, 28, 36, 0.25);
            --border-color: #222222;
            --text-main: #ffffff;
            --text-muted: #888888;
            --green-success: #22c55e;
            --blue-highlight: #38bdf8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* Top Header V4 */
        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-header .tagline {
            color: var(--v4-red);
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .brand-header h1 {
            margin: 0;
            font-size: 2.2em;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .brand-header h1 span {
            color: var(--v4-red);
        }

        /* Grid de KPIs */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--v4-red);
        }

        .kpi-card span {
            display: block;
            font-size: 0.75em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .kpi-card strong {
            font-size: 1.5em;
            font-weight: 800;
        }

        /* Lista e Cards dos Hunters (Estilo V4 Glow) */
        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 25px;
            background: rgba(17, 17, 17, 0.6);
            border: 1px solid var(--v4-red-glow);
            border-radius: 18px;
            box-shadow: 0 0 35px var(--v4-red-glow);
        }

        .ranking-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .ranking-card:hover {
            border-color: var(--v4-red);
            box-shadow: 0 0 15px var(--v4-red-glow);
            transform: translateX(4px);
        }

        /* Badge do Rank */
        .badge-rank {
            font-size: 1.1em;
            font-weight: 900;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #222;
            color: #fff;
            border: 1px solid #333;
        }

        .rank-1 { background: var(--v4-red); color: #fff; border-color: #ff4d4d; box-shadow: 0 0 10px var(--v4-red-glow); }
        .rank-2 { background: #e2e8f0; color: #000; border-color: #fff; }
        .rank-3 { background: #cd7f32; color: #fff; border-color: #ffa500; }

        /* Foto e Avatar */
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--v4-red);
        }

        .hunter-info {
            flex-grow: 1;
        }

        .hunter-name {
            font-weight: 700;
            font-size: 1.1em;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        /* Barra de Progresso V4 */
        .progress-bar-bg {
            background: #222222;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            width: 100%;
            max-width: 260px;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #ed1c24 0%, #ff4d4d 100%);
            height: 100%;
            border-radius: 4px;
        }

        /* Valores Métricos */
        .metrics {
            text-align: right;
            min-width: 150px;
        }

        .val-recebido {
            font-size: 1.15em;
            font-weight: 800;
            color: var(--green-success);
        }

        .val-meta {
            font-size: 0.8em;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .pct-realizado {
            font-size: 0.85em;
            font-weight: 700;
            color: var(--blue-highlight);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <div class="tagline">Nosso negócio é vender o seu</div>
            <h1>Ranking <span>Hunters</span></h1>
        </div>

        <!-- KPIs Totais -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <span>Total Recebido</span>
                <strong id="kpi-recebido" style="color: var(--green-success);">R$ 0,00</strong>
            </div>
            <div class="kpi-card">
                <span>Total Provisionado</span>
                <strong id="kpi-provisionado" style="color: #ffffff;">R$ 0,00</strong>
            </div>
            <div class="kpi-card">
                <span>Realizado Geral</span>
                <strong id="kpi-realizado" style="color: var(--blue-highlight);">0%</strong>
            </div>
        </div>

        <!-- Lista do Ranking -->
        <div class="ranking-list" id="ranking-container">
            <!-- Inserido dinamicamente pelo JS -->
        </div>
    </div>

    <script>
        const DATA_URL = './dados.json';

        function parseNumber(val) {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            return parseFloat(String(val).replace(/\./g, '').replace(',', '.').replace('%', '').trim()) || 0;
        }

        function formatBRL(val) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
        }

        async function render() {
            try {
                const res = await fetch(DATA_URL);
                const data = await res.json();

                const container = document.getElementById('ranking-container');
                container.innerHTML = '';

                let totalRecebido = 0;
                let totalProvisionado = 0;

                data.forEach((item, index) => {
                    const recebido = parseNumber(item.recebido);
                    const provisionado = parseNumber(item.provisionado);
                    let realizado = parseNumber(item.realizado);

                    if (realizado < 2 && realizado > 0) realizado = realizado * 100;

                    totalRecebido += recebido;
                    totalProvisionado += provisionado;

                    const rankPos = item.rank || (index + 1);
                    let rankClass = '';
                    if (rankPos == 1) rankClass = 'rank-1';
                    else if (rankPos == 2) rankClass = 'rank-2';
                    else if (rankPos == 3) rankClass = 'rank-3';

                    const avatarUrl = item.foto || 'https://via.placeholder.com/150';

                    const card = document.createElement('div');
                    card.className = 'ranking-card';
                    card.innerHTML = `
                        <div class="badge-rank ${rankClass}">${rankPos}</div>
                        <img src="${avatarUrl}" class="avatar" alt="${item.hunter}">
                        <div class="hunter-info">
                            <div class="hunter-name">${item.hunter}</div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${Math.min(realizado, 100)}%;"></div>
                            </div>
                        </div>
                        <div class="metrics">
                            <div class="val-recebido">${formatBRL(recebido)}</div>
                            <div class="val-meta">Meta: ${formatBRL(provisionado)}</div>
                            <div class="pct-realizado">${realizado.toFixed(2)}% realizado</div>
                        </div>
                    `;
                    container.appendChild(card);
                });

                document.getElementById('kpi-recebido').innerText = formatBRL(totalRecebido);
                document.getElementById('kpi-provisionado').innerText = formatBRL(totalProvisionado);
                const pctGeral = totalProvisionado > 0 ? (totalRecebido / totalProvisionado) * 100 : 0;
                document.getElementById('kpi-realizado').innerText = `${pctGeral.toFixed(2)}%`;

            } catch (err) {
                console.error("Erro ao carregar ranking:", err);
            }
        }

        render();
    </script>
</body>
</html>
