<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking de Cobrança</title>
    <!-- Atualiza a página automaticamente a cada 1 hora (3600 segundos) -->
    <meta http-equiv="refresh" content="3600">
    <style>
        /* ESTILOS (O VISUAL) */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px;
            margin: 0;
        }

        .dashboard-container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 30px;
            font-size: 2.2em;
        }

        .ranking-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #2a2a2a;
            margin-bottom: 15px;
            padding: 15px 20px;
            border-radius: 10px;
            transition: transform 0.2s;
        }

        .ranking-item:hover {
            transform: scale(1.02);
        }

        .posicao {
            font-size: 1.5em;
            font-weight: bold;
            width: 40px;
        }

        .nome {
            flex-grow: 1;
            font-size: 1.2em;
            margin-left: 15px;
        }

        .valor {
            font-size: 1.3em;
            font-weight: bold;
            color: #4CAF50;
        }

        /* Cores Especiais para o TOP 3 */
        .top-1 { background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%); color: #000; }
        .top-1 .valor { color: #000; }
        
        .top-2 { background: linear-gradient(135deg, #E0E0E0 0%, #A9A9A9 100%); color: #000; }
        .top-2 .valor { color: #000; }
        
        .top-3 { background: linear-gradient(135deg, #CD7F32 0%, #8B4513 100%); color: #000; }
        .top-3 .valor { color: #fff; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>🏆 Top Performers - Cobrança</h1>
        <ul class="ranking-list" id="lista-ranking">
            <!-- Os dados vão aparecer aqui via JavaScript -->
            <li>Carregando ranking...</li>
        </ul>
    </div>

    <script>
        /* JAVASCRIPT (A LÓGICA E CONEXÃO DE DADOS) */
        
        // COLE O SEU LINK JSON DO METABASE AQUI:
        const METABASE_JSON_URL = 'COLE_SEU_LINK_AQUI.json';

        // Função que busca os dados
        async function carregarRanking() {
            try {
                // OBS: Se você tiver problema de "CORS", veja o Passo 3 abaixo!
                const resposta = await fetch(METABASE_JSON_URL);
                const dados = await resposta.json();

                const listaHtml = document.getElementById('lista-ranking');
                listaHtml.innerHTML = ''; // Limpa a mensagem de carregando

                // Supondo que seu Metabase retorne um array de objetos. 
                // Ex: [{ "nome": "João", "valor_recuperado": 15000 }, ...]
                dados.forEach((operador, index) => {
                    const posicao = index + 1;
                    let classeTop = '';
                    
                    // Adiciona as classes CSS para o Top 1, 2 e 3
                    if (posicao === 1) classeTop = 'top-1';
                    else if (posicao === 2) classeTop = 'top-2';
                    else if (posicao === 3) classeTop = 'top-3';

                    // Formata o valor como Moeda (Reais)
                    const valorFormatado = new Intl.NumberFormat('pt-BR', { 
                        style: 'currency', 
                        currency: 'BRL' 
                    }).format(operador.valor_recuperado); // MUDE 'valor_recuperado' para o nome exato da coluna na sua query

                    // Cria o card do operador
                    const li = document.createElement('li');
                    li.className = `ranking-item ${classeTop}`;
                    li.innerHTML = `
                        <div class="posicao">#${posicao}</div>
                        <div class="nome">${operador.nome}</div> <!-- MUDE 'nome' para a sua coluna -->
                        <div class="valor">${valorFormatado}</div>
                    `;
                    
                    listaHtml.appendChild(li);
                });

            } catch (erro) {
                console.error("Erro ao carregar os dados: ", erro);
                document.getElementById('lista-ranking').innerHTML = '<li>Erro ao carregar o ranking. Verifique a conexão.</li>';
            }
        }

        // Executa a função quando a página abre
        carregarRanking();
        
        // Opcional: Atualiza os dados a cada 10 minutos sem recarregar a tela inteira
        setInterval(carregarRanking, 600000); 
    </script>
</body>
</html>
