<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Hunters - Cobrança</title>
    <meta http-equiv="refresh" content="600">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 2em;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        /* KPIs Gerais */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
        }

        .kpi-card span {
            display: block;
            font-size: 0.85em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .kpi-card strong {
            font-size: 1.5em;
            color: var(--accent-green);
        }

        /* Tabela / Lista do Ranking */
        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ranking-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #334155;
            transition: transform 0.2s ease;
        }

        .ranking-card:hover {
            transform: translateY(-2px);
            background: var(--card-hover);
        }

        .badge-rank {
            font-size: 1.2em;
            font-weight: 700;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #334155;
            color: #fff;
        }

        /* Estilo TOP 3 */
        .rank-1 { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; }
        .rank-2 { background: linear-gradient(135deg, #94a3b8, #64748b); color: #000; }
        .rank-3 { background: linear-gradient(135deg, #b45309, #78350f); color: #fff; }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #475569;
        }

        .hunter-info {
            flex-grow: 1;
        }

        .hunter-name {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            background: #0f172a;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            width: 100%;
            max-width: 250px;
        }

        .progress-bar-fill {
            background: var(--accent-green);
            height: 100%;
            border-radius: 4px;
        }

        .metrics {
            text-align: right;
            min-width: 140px;
        }

        .val-recebido {
            font-size: 1.1em;
            font-weight: 700;
            color: var(--accent-green);
        }

        .val-meta {
            font-size: 0.8em;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .pct-realizado {
            font-size: 0.85em;
            font-weight: 600;
            color: #38bdf8;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🏆 Ranking Hunters</h1>
        </div>

        <!-- Totais da Operação -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <span>Total Recebido</span>
                <strong id="kpi-recebido">R$ 0,00</strong>
            </div>
            <div class="kpi-card">
                <span>Total Provisionado</span>
                <strong id="kpi-provisionado" style="color: #f8fafc;">R$ 0,00</strong>
            </div>
            <div class="kpi-card">
                <span>Realizado Geral</span>
                <strong id="kpi-realizado" style="color: #38bdf8;">0%</strong>
            </div>
        </div>

        <!-- Lista dos Hunters -->
        <div class="ranking-list" id="ranking-container">
            <!-- Inserido dinamicamente via JS -->
        </div>
    </div>

    <script>
        const DATA_URL = './dados.json';

        function parseNumber(val) {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            return parseFloat(String(val).replace(/\./g, '').replace(',', '.').replace('%', '').trim()) || 0;
        }

        function formatBRL(val) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
        }

        async function render() {
            try {
                const res = await fetch(DATA_URL);
                const data = await res.json();

                const container = document.getElementById('ranking-container');
                container.innerHTML = '';

                let totalRecebido = 0;
                let totalProvisionado = 0;

                data.forEach((item, index) => {
                    const recebido = parseNumber(item.recebido);
                    const provisionado = parseNumber(item.provisionado);
                    let realizado = parseNumber(item.realizado);

                    // Ajuste caso o realizado venha em decimal (ex: 0.6855)
                    if (realizado < 2 && realizado > 0) realizado = realizado * 100;

                    totalRecebido += recebido;
                    totalProvisionado += provisionado;

                    const rankPos = item.rank || (index + 1);
                    let rankClass = '';
                    if (rankPos == 1) rankClass = 'rank-1';
                    else if (rankPos == 2) rankClass = 'rank-2';
                    else if (rankPos == 3) rankClass = 'rank-3';

                    const avatarUrl = item.foto || 'https://via.placeholder.com/150';

                    const card = document.createElement('div');
                    card.className = 'ranking-card';
                    card.innerHTML = `
                        <div class="badge-rank ${rankClass}">${rankPos}</div>
                        <img src="${avatarUrl}" class="avatar" alt="${item.hunter}">
                        <div class="hunter-info">
                            <div class="hunter-name">${item.hunter}</div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${Math.min(realizado, 100)}%;"></div>
                            </div>
                        </div>
                        <div class="metrics">
                            <div class="val-recebido">${formatBRL(recebido)}</div>
                            <div class="val-meta">Meta: ${formatBRL(provisionado)}</div>
                            <div class="pct-realizado">${realizado.toFixed(2)}% realizado</div>
                        </div>
                    `;
                    container.appendChild(card);
                });

                // Atualiza KPIs do topo
                document.getElementById('kpi-recebido').innerText = formatBRL(totalRecebido);
                document.getElementById('kpi-provisionado').innerText = formatBRL(totalProvisionado);
                const pctGeral = totalProvisionado > 0 ? (totalRecebido / totalProvisionado) * 100 : 0;
                document.getElementById('kpi-realizado').innerText = `${pctGeral.toFixed(2)}%`;

            } catch (err) {
                console.error("Erro ao carregar ranking:", err);
            }
        }

        render();
    </script>
</body>
</html>
